name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint API routes, tests and server libraries
        run: npx eslint tests app/api lib/storyEvaluator.ts lib/readJson.ts lib/languages.ts lib/pricing.ts lib/kalawallet.ts lib/rateLimit.ts lib/requireUser.ts lib/useFollowingState.ts lib/gemini.ts lib/imageProviders.ts lib/voiceAgent.ts lib/voiceAgentData.ts lib/fairPrice.ts lib/wav.ts app/voice components/VoiceAgentBanner.tsx lib/artDirector.ts lib/authErrors.ts lib/useAI.ts
